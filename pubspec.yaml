name: recipe_app
description: "Create a Recipe App."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipetypes.json
    - assets/images/pancakes.jpg
    - assets/images/sandwich.jpg
    - assets/images/spaghetti.jpg
    - assets/images/brownie.jpg
    - assets/images/iced_tea.jpg